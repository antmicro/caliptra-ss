---
seed: 1
testname: caliptra_ss_lcc_volatile_unlock_cnt
pre-exec: |
  echo "Running pre_exec for [caliptra_ss_lcc_volatile_unlock_cnt]"
  echo "Generate predefined LC start state and LC counter value."
  rm -rf otp-img.2048.vmem
  # Raw with non-0 count, to cover a corner case
  $CALIPTRA_SS_ROOT/tools/scripts/fuse_ctrl_script/gen_fuse_ctrl_vmem.py --seed ${PLAYBOOK_RANDOM_SEED} --lc-cnt 23 --lc-state 0 --lc-state-def $CALIPTRA_SS_ROOT/tools/scripts/fuse_ctrl_script/lc_ctrl_state.hjson --mmap-def $CALIPTRA_SS_ROOT/src/fuse_ctrl/data/otp_ctrl_mmap.hjson --token-configuration $CALIPTRA_SS_ROOT/src/integration/test_suites/caliptra_ss_lcc_volatile_unlock/test_unlock_token.hjson -o otp-img.2048.vmem
  CALIPTRA_ROOT=$CALIPTRA_SS_ROOT/third_party/caliptra-rtl make -f $CALIPTRA_SS_ROOT/third_party/caliptra-rtl/tools/scripts/Makefile CALIPTRA_INTERNAL_TRNG=0 TESTNAME=smoke_test_mbox program.hex
  make -f $CALIPTRA_SS_ROOT/tools/scripts/Makefile TESTNAME=caliptra_ss_lcc_volatile_unlock mcu_program.hex
